name: Deploy to Surge
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # ビルドはせず、今のファイル（./）をそのままデプロイします
      - run: npx surge ./ nexus-vortx.surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
