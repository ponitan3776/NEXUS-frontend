name: Deploy to Surge
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install && npm run build
      - run: npx surge ./dist nexus-vortx.surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
